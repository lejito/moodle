; Ajustes de PHP para Moodle y sus pruebas.
max_input_vars = 5000
memory_limit = 1G

; pcov queda apagado y solo se enciende al pedir cobertura (php -d pcov.enabled=1),
; porque medir cada prueba la vuelve más lenta. pcov.directory apunta a public/:
; si no, pcov elegiría la carpeta lib/ de la raíz, que es un shim, y no mediría nada.
pcov.enabled = 0
pcov.directory = /var/www/moodle/public
