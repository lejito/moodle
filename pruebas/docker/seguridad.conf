# Cabeceras de seguridad de Apache para Moodle. Corrigen los hallazgos de ZAP SEC-01, 03, 04 y 05
# (pruebas/seguridad, criterio 13). Las usa la imagen base, así que valen para el entorno de
# desarrollo, el de las pruebas en Jenkins y el despliegue.
#
# Cada cabecera se quita primero de la tabla normal (`Header unset`) y se pone en la de siempre
# (`Header always set`): así queda una sola copia aunque Moodle ya la haya enviado desde PHP, como
# hace con X-Content-Type-Options en las respuestas AJAX, y llega también en las páginas de error.

# SEC-03: el servidor no dice su versión ni la de PHP (expose_php = Off va en php.ini). Debian ya
# trae security.conf con ServerTokens OS; este archivo se carga después (orden alfabético) y gana.
ServerTokens Prod
ServerSignature Off

# SEC-04: el navegador no adivina el tipo de un archivo; usa el que dice Moodle.
Header unset X-Content-Type-Options
Header always set X-Content-Type-Options "nosniff"

# SEC-01: CSP en modo solo reporte. Moodle usa JavaScript en línea y eval() (YUI, plantillas), así
# que una CSP obligatoria que lo permita no protegería, y una que no lo permita rompería las páginas.
# En modo reporte el navegador avisa en la consola de lo que bloquearía y no bloquea nada: es el
# primer paso para ajustar una política propia antes de exigirla.
Header unset Content-Security-Policy-Report-Only
Header always set Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self'; frame-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"

# SEC-05: funciones del navegador. La cámara, el micrófono y la captura de pantalla quedan solo para
# el propio sitio, porque las usa el grabador de audio y video del editor (tiny_recordrtc).
Header unset Permissions-Policy
Header always set Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), hid=()"

# SEC-05: aislamiento entre orígenes (Spectre). Otra página no puede quedarse con una referencia a
# las ventanas de Moodle ni cargar sus recursos. No se envía Cross-Origin-Embedder-Policy: obligaría a
# que todo lo que la página incrusta de otro origen lo autorice, y rompería los videos de YouTube o
# Vimeo que los docentes ponen en sus recursos y mensajes. Queda como riesgo aceptado.
Header unset Cross-Origin-Opener-Policy
Header always set Cross-Origin-Opener-Policy "same-origin"
Header unset Cross-Origin-Resource-Policy
Header always set Cross-Origin-Resource-Policy "same-origin"
