# Sitio de Moodle para las pruebas manuales, E2E, de accesibilidad y de
# seguridad. Solo se sirve public/: la raíz del repositorio (config.php,
# vendor/, pruebas/) queda fuera de la web, como pide el layout de Moodle.
<VirtualHost *:80>
    DocumentRoot /var/www/moodle/public

    <Directory /var/www/moodle/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php index.html

        # Las rutas que no son un archivo las atiende el router de Moodle. Va
        # con $CFG->routerconfigured = true en config.php.
        FallbackResource /r.php
    </Directory>

    # Moodle lee la ruta de los scripts (file.php/123/archivo.pdf) de PATH_INFO.
    AcceptPathInfo On

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
