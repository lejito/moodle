name: Pruebas y calidad

# Pipeline anterior del proyecto de pruebas de software, 100 % en la nube: GitHub
# Actions ejecuta las pruebas y SonarQube Cloud analiza y aplica el umbral de
# calidad.
#
# APAGADO: el pipeline del proyecto es ahora Jenkins con SonarQube local
# (pruebas/jenkins/Jenkinsfile). Este workflow se conserva y solo corre si se lanza
# a mano desde la pestaña Actions; para volver a encenderlo, se restauran los
# disparadores push (rama main) y pull_request.
on:
  workflow_dispatch:

# Un push nuevo a la misma rama reemplaza la corrida de un pull request, pero nunca
# una de main.
concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  phpunit:
    # Un solo job: el sitio de pruebas se instala una vez y los componentes
    # corren uno tras otro, un step por funcionalidad. Es más lento que una
    # matriz en paralelo, pero instala Moodle una sola vez.
    name: Pruebas unitarias
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # La plantilla de configuración de Moodle apunta a estos dos servicios; se
      # levantan igual que en push.yml para que ninguna prueba dependa de que falten.
      exttests:
        image: moodlehq/moodle-exttests
        ports: ['8080:80']
      redis:
        image: redis
        ports: ['6379:6379']
    # .github/workflows/config-template.php lee el motor de base de datos de aquí
    # en cada carga, no solo al instalar.
    env:
      dbtype: pgsql
    steps:
      - uses: actions/checkout@v6

      # pcov detecta su directorio solo y, al existir lib/ en la raíz, tomaría ese
      # shim en lugar del código: sin pcov.directory la cobertura sale vacía.
      - name: PHP 8.4 con pcov
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: pcov
          ini-values: max_input_vars=5000, pcov.directory=${{ github.workspace }}/public

      # init.php instala las dependencias de Composer y el sitio de pruebas.
      # --buildcomponentconfigs genera un phpunit.xml por componente, cuya
      # cobertura incluye solo ese componente y no todo Moodle.
      - name: Preparar el sitio de pruebas
        id: preparar
        run: |
          echo "pathtophp=$(which php)" >> "$GITHUB_ENV"
          cp .github/workflows/config-template.php config.php
          mkdir ../moodledata
          sudo locale-gen en_AU.UTF-8
          php public/admin/tool/phpunit/cli/init.php --no-composer-self-update
          php public/admin/tool/phpunit/cli/util.php --buildcomponentconfigs

      # Los componentes de las funcionalidades evaluadas, un step por cada una.
      # Estos steps y sonar.sources / sonar.exclusions de
      # sonar-project.properties van juntos: si cambia una funcionalidad,
      # cambian los dos. Cada step corre aunque falle uno anterior, y el job
      # falla si alguno falló. El detalle está en pruebas/ci/phpunit.sh.
      - name: 'RF-MOOD-01 · enrol_self'
        if: ${{ !cancelled() && steps.preparar.outcome == 'success' }}
        run: bash pruebas/ci/phpunit.sh enrol_self public/enrol/self

      - name: 'RF-MOOD-02 y 03 · mod_assign'
        if: ${{ !cancelled() && steps.preparar.outcome == 'success' }}
        run: bash pruebas/ci/phpunit.sh mod_assign public/mod/assign

      - name: 'RF-MOOD-02 · assignsubmission (texto en línea y archivo)'
        if: ${{ !cancelled() && steps.preparar.outcome == 'success' }}
        run: >-
          bash pruebas/ci/phpunit.sh assignsubmission
          public/mod/assign/submission/onlinetext
          public/mod/assign/submission/file

      - name: 'RF-MOOD-04 · mod_quiz'
        if: ${{ !cancelled() && steps.preparar.outcome == 'success' }}
        run: bash pruebas/ci/phpunit.sh mod_quiz public/mod/quiz

      # Todas las reglas de acceso salvo Safe Exam Browser (seb), que ninguna
      # funcionalidad usa.
      - name: 'RF-MOOD-04 · quizaccess (reglas de acceso)'
        if: ${{ !cancelled() && steps.preparar.outcome == 'success' }}
        run: >-
          bash pruebas/ci/phpunit.sh quizaccess
          public/mod/quiz/accessrule/delaybetweenattempts
          public/mod/quiz/accessrule/ipaddress
          public/mod/quiz/accessrule/numattempts
          public/mod/quiz/accessrule/offlineattempts
          public/mod/quiz/accessrule/openclosedate
          public/mod/quiz/accessrule/password
          public/mod/quiz/accessrule/securewindow
          public/mod/quiz/accessrule/timelimit

      - name: 'RF-MOOD-05 · mod_forum'
        if: ${{ !cancelled() && steps.preparar.outcome == 'success' }}
        run: bash pruebas/ci/phpunit.sh mod_forum public/mod/forum

      - name: Guardar la cobertura
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: cobertura
          path: coverage/*.xml
          retention-days: 7

      - name: Guardar el reporte de resultados
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: resultados-junit
          path: reports/*.xml
          retention-days: 14

  # Moodle desplegado con Docker dentro del runner, con los mismos Dockerfile y compose.yml del entorno
  # local: instala el sitio, siembra los datos, habilita la API REST y lo sirve en http://localhost:8000.
  # Las pruebas E2E y de API corren contra esta instancia. Va en paralelo a las pruebas unitarias.
  despliegue:
    name: Despliegue en Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      COMPOSE_FILE: compose.yml:compose.ci.yml
    steps:
      - uses: actions/checkout@v6

      # vendor/ se instala en el runner y se monta en los contenedores (compose.ci.yml). Las extensiones
      # las trae la imagen, no el PHP del runner. Va con las dependencias de desarrollo porque la siembra
      # usa el generador de preguntas, que carga PHPUnit.
      - name: Dependencias de Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist --ignore-platform-req='ext-*'

      - name: Imagen de PHP 8.4 con Apache
        working-directory: pruebas/docker
        run: |
          cp config.php ../../config.php
          docker compose build

      - name: Instalar Moodle, sembrar los datos y habilitar la API REST
        working-directory: pruebas/docker
        run: |
          docker compose run --rm -T moodle php admin/cli/install_database.php --agree-license --lang=en \
            --fullname="Moodle de pruebas" --shortname="Pruebas" \
            --adminuser=admin --adminpass='Pruebas-2026' --adminemail=admin@example.com
          docker compose run --rm -T moodle php pruebas/seed/sembrar.php
          docker compose run --rm -T moodle php pruebas/seed/servicios_web.php
          docker compose up -d web

      - name: Prueba de humo (interfaz y API REST)
        run: bash pruebas/ci/humo.sh

      - name: Registro de Apache si algo falla
        if: failure()
        working-directory: pruebas/docker
        run: docker compose logs web

  quality:
    name: Análisis de calidad
    needs: phpunit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          # Sonar necesita el historial para atribuir el código y calcular el
          # código nuevo, sobre el que se evalúa el umbral de calidad.
          fetch-depth: 0

      # Los reportes traen rutas absolutas del runner; esta ejecución usa la misma
      # ruta de trabajo, así que Sonar las resuelve sin reescribirlas.
      - name: Recuperar los reportes de cobertura
        uses: actions/download-artifact@v8
        with:
          name: cobertura
          path: coverage

      - name: Listar los reportes para Sonar
        id: coverage
        run: echo "paths=$(ls coverage/*.xml | paste -sd, -)" >> "$GITHUB_OUTPUT"

      # sonar-project.properties tiene el alcance del análisis. La organización y la
      # clave del proyecto vienen de las variables del repositorio, como en
      # beverage-ledger. qualitygate.wait hace fallar este job si no se cumple el
      # umbral de calidad.
      - name: Análisis y umbral de calidad
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.php.coverage.reportPaths=${{ steps.coverage.outputs.paths }}
            -Dsonar.qualitygate.wait=true
