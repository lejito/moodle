name: Pruebas y calidad

# Pipeline del proyecto de pruebas de software sobre este fork, 100 % en la nube:
# GitHub Actions ejecuta las pruebas y SonarQube Cloud analiza y aplica el umbral
# de calidad. Corre sobre main porque los workflows de Moodle (push.yml y
# composed.yml) ignoran esa rama, así que los dos nunca se ejecutan a la vez.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Un push nuevo a la misma rama reemplaza la corrida de un pull request, pero nunca
# una de main.
concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  phpunit:
    name: 'Pruebas unitarias (${{ matrix.component }})'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Los componentes de las funcionalidades evaluadas. Esta lista y
      # sonar.sources / sonar.exclusions de sonar-project.properties van juntas:
      # si cambia una funcionalidad, cambian las dos.
      #
      # paths admite varias carpetas separadas por espacios. Cada una tiene su
      # propio phpunit.xml, y se usa para agrupar en un job los subplugins
      # pequeños que usan las funcionalidades.
      matrix:
        include:
          - component: enrol_self # Automatriculación con clave
            paths: public/enrol/self
          - component: mod_assign # Entregar y calificar una tarea
            paths: public/mod/assign
          - component: assignsubmission # Entregar: texto en línea y archivo
            paths: >-
              public/mod/assign/submission/onlinetext
              public/mod/assign/submission/file
          - component: mod_quiz # Presentar un cuestionario
            paths: public/mod/quiz
          - component: quizaccess # Reglas de acceso al presentar un cuestionario
            paths: >-
              public/mod/quiz/accessrule/delaybetweenattempts
              public/mod/quiz/accessrule/ipaddress
              public/mod/quiz/accessrule/numattempts
              public/mod/quiz/accessrule/offlineattempts
              public/mod/quiz/accessrule/openclosedate
              public/mod/quiz/accessrule/password
              public/mod/quiz/accessrule/securewindow
              public/mod/quiz/accessrule/timelimit
          - component: core_ai # Límite de solicitudes del proveedor de IA
            paths: public/ai
          - component: aiplacement_courseassist # Resumir contenido con IA
            paths: public/ai/placement/courseassist
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # La plantilla de configuración de Moodle apunta a estos dos servicios; se
      # levantan igual que en push.yml para que ninguna prueba dependa de que falten.
      exttests:
        image: moodlehq/moodle-exttests
        ports: ['8080:80']
      redis:
        image: redis
        ports: ['6379:6379']
    # .github/workflows/config-template.php lee el motor de base de datos de aquí
    # en cada carga, no solo al instalar.
    env:
      dbtype: pgsql
    steps:
      - uses: actions/checkout@v6

      # pcov detecta su directorio solo y, al existir lib/ en la raíz, tomaría ese
      # shim en lugar del código: sin pcov.directory la cobertura sale vacía.
      - name: PHP 8.4 con pcov
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: pcov
          ini-values: max_input_vars=5000, pcov.directory=${{ github.workspace }}/public

      # init.php instala las dependencias de Composer y el sitio de pruebas.
      # --buildcomponentconfigs genera un phpunit.xml por componente, cuya
      # cobertura incluye solo ese componente y no todo Moodle.
      - name: Preparar el sitio de pruebas
        run: |
          echo "pathtophp=$(which php)" >> "$GITHUB_ENV"
          cp .github/workflows/config-template.php config.php
          mkdir ../moodledata
          sudo locale-gen en_AU.UTF-8
          php public/admin/tool/phpunit/cli/init.php --no-composer-self-update
          php public/admin/tool/phpunit/cli/util.php --buildcomponentconfigs

      # Con cobertura, PHPUnit valida los atributos Covers*. Si una prueba
      # declara un objetivo inexistente, emite un aviso y descarta toda la
      # cobertura de esa prueba. El aviso falla el job a propósito.
      #
      # Cada carpeta corre aunque falle una anterior, y el job falla al final si
      # alguna falló. Los reportes se nombran <componente>-<carpeta>, porque el
      # job de calidad los junta todos en una sola carpeta.
      - name: Pruebas con cobertura
        run: |
          mkdir -p coverage reports
          status=0
          for dir in ${{ matrix.paths }}; do
            name="${{ matrix.component }}-$(basename "$dir")"
            echo "::group::$dir"
            vendor/bin/phpunit -c "$dir" \
              --coverage-clover "coverage/$name.xml" \
              --log-junit "reports/$name.xml" || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Guardar la cobertura
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.component }}
          path: coverage/*.xml
          retention-days: 7

      - name: Guardar el reporte de resultados
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-${{ matrix.component }}
          path: reports/*.xml
          retention-days: 14

  quality:
    name: Análisis de calidad
    needs: phpunit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          # Sonar necesita el historial para atribuir el código y calcular el
          # código nuevo, sobre el que se evalúa el umbral de calidad.
          fetch-depth: 0

      # Los reportes traen rutas absolutas del runner; esta ejecución usa la misma
      # ruta de trabajo, así que Sonar las resuelve sin reescribirlas.
      - name: Recuperar los reportes de cobertura
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage
          merge-multiple: true

      - name: Listar los reportes para Sonar
        id: coverage
        run: echo "paths=$(ls coverage/*.xml | paste -sd, -)" >> "$GITHUB_OUTPUT"

      # sonar-project.properties tiene el alcance del análisis. La organización y la
      # clave del proyecto vienen de las variables del repositorio, como en
      # beverage-ledger. qualitygate.wait hace fallar este job si no se cumple el
      # umbral de calidad.
      - name: Análisis y umbral de calidad
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.php.coverage.reportPaths=${{ steps.coverage.outputs.paths }}
            -Dsonar.qualitygate.wait=true
