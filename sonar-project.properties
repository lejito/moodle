# Análisis del proyecto de pruebas de software en SonarQube Cloud.
# La organización y la clave del proyecto llegan desde .github/workflows/pruebas.yml
# (variables SONAR_ORGANIZATION y SONAR_PROJECT_KEY del repositorio).

sonar.sourceEncoding=UTF-8

# Solo los componentes de las funcionalidades evaluadas, no todo Moodle. Tienen que
# coincidir con la matriz del job phpunit de pruebas.yml.
sonar.sources=\
  public/enrol/self,\
  public/mod/assign,\
  public/mod/quiz,\
  public/mod/forum

# Las pruebas viven dentro de cada componente, en tests/. Fuentes y pruebas
# comparten carpetas y las separan las inclusiones y exclusiones.
sonar.tests=\
  public/enrol/self,\
  public/mod/assign,\
  public/mod/quiz,\
  public/mod/forum
sonar.test.inclusions=**/tests/**

# Pruebas, JavaScript compilado (versionado, pero generado por Grunt) y cadenas
# de idioma, que son arreglos de texto y no lógica.
#
# Los subplugins son componentes con nombre propio y tienen sus propias pruebas.
# Solo se analizan los que usan las funcionalidades y están en la matriz de
# pruebas.yml: assignsubmission_onlinetext y assignsubmission_file, y las reglas
# de acceso del cuestionario, salvo Safe Exam Browser. Los demás, incluido el
# reporte del foro, se excluyen; si no, contarían como 0 % de cobertura.
sonar.exclusions=\
  **/tests/**,\
  **/amd/build/**,\
  **/yui/build/**,\
  **/lang/**,\
  public/mod/assign/feedback/**,\
  public/mod/assign/submission/comments/**,\
  public/mod/quiz/report/**,\
  public/mod/quiz/accessrule/seb/**,\
  public/mod/forum/report/**

# La cobertura sale de PHPUnit y solo mide PHP. El JavaScript y las plantillas no
# tienen reporte de cobertura y contarían como 0 %.
sonar.coverage.exclusions=\
  **/amd/src/**,\
  **/yui/src/**,\
  **/templates/**,\
  **/db/**,\
  **/version.php
